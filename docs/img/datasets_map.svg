<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1100" height="470" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Datasets and models: what feeds which phase</text>

  <!-- column headers -->
  <g font-weight="700" fill="#334155">
    <text x="40" y="70">Dataset / model</text>
    <text x="430" y="70">Track</text>
    <text x="520" y="70">Phases</text>
    <text x="900" y="70">Licence</text>
  </g>
  <line x1="30" y1="78" x2="1070" y2="78" stroke="#94a3b8"/>

  <!-- rows -->
  <g fill="#1e293b">
    <rect x="30" y="88" width="1040" height="30" rx="6" fill="#eef4ff"/>
    <text x="40" y="108">MSD Task04 Hippocampus — 394 MRI volumes</text><text x="430" y="108" fill="#2f5bb7" font-weight="700">mri</text>
    <text x="520" y="108">1 ingest · 2 preprocess · 3 segment · 4 uncertainty · 5 biomarkers · 8 covariates · 9 audit</text><text x="900" y="108">CC-BY-SA 4.0</text>

    <rect x="30" y="124" width="1040" height="30" rx="6" fill="#fdf0f5"/>
    <text x="40" y="144">Kather 2016 — 5,000 H&amp;E tiles, 8 tissue classes</text><text x="430" y="144" fill="#9c2f62" font-weight="700">pathology</text>
    <text x="520" y="144">1 · 2 stain · 6 FM benchmark + stain shift · 9 audit (OOD)</text><text x="900" y="144">CC-BY 4.0</text>

    <rect x="30" y="160" width="1040" height="30" rx="6" fill="#fdf0f5"/>
    <text x="40" y="180">PanNuke (one fold) — nuclei outlined and typed</text><text x="430" y="180" fill="#9c2f62" font-weight="700">pathology</text>
    <text x="520" y="180">1 · 3 nucleus segmentation (AJI/PQ) · 5 phenotypes · 7 cell graphs, GNN · 9 audit</text><text x="900" y="180">CC-BY-NC-SA 4.0 ⚠</text>

    <rect x="30" y="196" width="1040" height="30" rx="6" fill="#fdf0f5"/>
    <text x="40" y="216">DeepLIIF (test set) — IHC ↔ multiplex IF, same cells</text><text x="430" y="216" fill="#9c2f62" font-weight="700">pathology</text>
    <text x="520" y="216">1 · 3 · 5 positivity · 8 IHC↔mIF agreement</text><text x="900" y="216">recorded at download</text>

    <rect x="30" y="232" width="1040" height="30" rx="6" fill="#fdf0f5"/>
    <text x="40" y="252">MCMICRO exemplar-001 — 12-channel CyCIF core</text><text x="430" y="252" fill="#9c2f62" font-weight="700">pathology</text>
    <text x="520" y="252">1 OME-TIFF · 3 fluorescence segmentation · 5 per-channel positivity</text><text x="900" y="252">recorded at download</text>

    <rect x="30" y="268" width="1040" height="30" rx="6" fill="#fdf0f5"/>
    <text x="40" y="288">10x Visium sample (squidpy) — spots + H&amp;E</text><text x="430" y="288" fill="#9c2f62" font-weight="700">pathology</text>
    <text x="520" y="288">1 · 7 spatial statistics · 8 H&amp;E → expression</text><text x="900" y="288">recorded at download</text>

    <rect x="30" y="304" width="1040" height="30" rx="6" fill="#f1f5f9"/>
    <text x="40" y="324">Synthetic generators (in repo) — volumes, tiles, mIF, spots, covariates</text><text x="430" y="324" fill="#334155" font-weight="700">both</text>
    <text x="520" y="324">every phase, offline; tests; teaching</text><text x="900" y="324">MIT</text>
  </g>

  <line x1="30" y1="346" x2="1070" y2="346" stroke="#94a3b8"/>
  <g fill="#1e293b">
    <text x="40" y="370" font-weight="700" fill="#334155">Pre-trained models (all CPU)</text>
    <text x="40" y="392">InstanSeg — nuclei/cells, brightfield + fluorescence → phase 3 · Phikon (ViT-B) — pathology foundation model → phase 6</text>
    <text x="40" y="412">PLIP — zero-shot from text → phase 6 · DINOv2-small, ResNet-50 — general baselines → phase 6 · 3D U-Net (MONAI) — trained here → phase 3</text>
    <text x="40" y="440" fill="#64748b" font-size="12">⚠ non-commercial: results derived from PanNuke or Phikon inherit the restriction and say so. Sizes and checksums are recorded in docs/08-data-and-models.md at download.</text>
  </g>
</svg>
