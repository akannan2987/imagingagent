# Continuous integration: every push and pull request installs the package
# from scratch on Windows, macOS and Linux, lints it, runs the tests and
# runs the doctor command. If any step fails, the branch shows a red cross
# and the problem is visible before anyone builds on top of it.
#
# RHEL 8 is not a hosted runner; the Ubuntu job stands in for Linux here and
# docs/01-setup-rhel8.md covers RHEL 8 by hand.

name: ci

on:
  push:
    branches: [master, beta, develop]
  pull_request:
    branches: [master, beta, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the exact locked environment, then the package
        # requirements.lock is the full frozen dependency tree (see ADR 0007).
        # Installing from it on three operating systems is what proves the
        # lock is portable. The package itself is installed editable on top.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run the test suite
        run: pytest

      - name: Smoke-test the command line
        run: |
          imagingagent version
          imagingagent doctor --config configs/default.yaml
